name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deployment at a time per branch; a newer push supersedes an older run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Declaring an environment is what puts the deployment and its URL on the
    # repository's Environments panel and beside each commit. Without this the
    # workflow can deploy successfully and still show no live environment.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}

    env:
      # The Vercel CLI picks all three up from the environment, so no secret is
      # ever interpolated into a command line.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Production on main, a preview URL for pull requests.
      TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

    steps:
      - name: Check the Vercel credentials are present
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "VERCEL_TOKEN comes from vercel.com -> Account Settings -> Tokens."
            echo "VERCEL_ORG_ID and VERCEL_PROJECT_ID are in the Vercel project's"
            echo "Settings -> General, or in .vercel/project.json after 'vercel link'."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment="$TARGET"

      - name: Build
        run: |
          if [ "$TARGET" = "production" ]; then
            vercel build --prod
          else
            vercel build
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "$TARGET" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod)
          else
            url=$(vercel deploy --prebuilt)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Live at"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
